<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Tipos de atención</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<!-- La pagina le indica al JS comun que endpoint de la API usar -->
<body data-endpoint="/tipos-atencion" data-nombre="tipo de atención">
    <main class="container py-4">
        <div class="titulo-pagina">
            <h1><i class="bi bi-clipboard2-check text-vet"></i> Tipos de atención</h1>
            <button id="btn-nuevo" class="btn btn-vet"><i class="bi bi-plus-lg"></i> Nuevo tipo</button>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="filtro-inactivos">
            <label class="form-check-label" for="filtro-inactivos">Mostrar inactivos</label>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Id</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog">
            <form id="form-catalogo" class="modal-content" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Nuevo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label for="nombre" class="form-label">Nombre *</label>
                    <input type="text" id="nombre" class="form-control" maxlength="50" required>
                    <div class="invalid-feedback">Obligatorio.</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-vet">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
