<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="container py-4">
        <div class="titulo-pagina">
            <h1><i class="bi bi-bar-chart-line text-vet"></i> Dashboard</h1>
            <a href="atenciones.html" class="btn btn-vet"><i class="bi bi-plus-lg"></i> Registrar atención</a>
        </div>

        <!-- 1. Facturacion mensual -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <div>
                        <h2 class="h5 mb-0">Facturación mensual</h2>
                        <small class="text-muted">Total cobrado en atenciones activas por mes</small>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="text-end">
                            <small class="text-muted d-block">Total del período</small>
                            <span class="total-destacado" id="total-facturacion">-</span>
                        </div>
                        <select id="filtro-anio" class="form-select w-auto"></select>
                    </div>
                </div>
                <div class="grafico"><canvas id="grafico-facturacion"></canvas></div>
            </div>
        </div>

        <div class="row g-4">
            <!-- 2. Cantidad e importe por tipo de atencion -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-0">Atenciones por tipo</h2>
                        <small class="text-muted">Cantidad e importe por tipo de atención</small>
                        <form id="form-tipo" class="row g-2 align-items-end my-3">
                            <div class="col-5">
                                <label class="form-label small mb-1" for="tipo-desde">Desde</label>
                                <input type="date" id="tipo-desde" class="form-control form-control-sm">
                            </div>
                            <div class="col-5">
                                <label class="form-label small mb-1" for="tipo-hasta">Hasta</label>
                                <input type="date" id="tipo-hasta" class="form-control form-control-sm">
                            </div>
                            <div class="col-2 d-grid">
                                <button class="btn btn-sm btn-outline-secondary" title="Aplicar"><i class="bi bi-funnel"></i></button>
                            </div>
                        </form>
                        <div class="grafico mb-3" style="height: 240px;"><canvas id="grafico-tipos"></canvas></div>
                        <table class="table table-sm mb-0">
                            <thead>
                                <tr><th>Tipo</th><th class="text-end">Cantidad</th><th class="text-end">Importe</th></tr>
                            </thead>
                            <tbody id="tabla-tipos"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 3. Top 5 clientes -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-0">Top 5 de clientes</h2>
                        <small class="text-muted">Clientes con más atenciones en el período</small>
                        <form id="form-top" class="row g-2 align-items-end my-3">
                            <div class="col-5">
                                <label class="form-label small mb-1" for="top-desde">Desde</label>
                                <input type="date" id="top-desde" class="form-control form-control-sm">
                            </div>
                            <div class="col-5">
                                <label class="form-label small mb-1" for="top-hasta">Hasta</label>
                                <input type="date" id="top-hasta" class="form-control form-control-sm">
                            </div>
                            <div class="col-2 d-grid">
                                <button class="btn btn-sm btn-outline-secondary" title="Aplicar"><i class="bi bi-funnel"></i></button>
                            </div>
                        </form>
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr><th>#</th><th>Cliente</th><th class="text-end">Atenciones</th><th class="text-end">Importe total</th></tr>
                            </thead>
                            <tbody id="tabla-top"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
