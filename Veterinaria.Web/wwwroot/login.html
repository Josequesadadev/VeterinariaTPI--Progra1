<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Ingresar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="login-contenedor px-3">
        <div class="card login-card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-heart-pulse icono-grande"></i>
                    <h1 class="h4 mt-2">Ingresar</h1>
                    <p class="text-muted small mb-0">Sistema de gestión veterinaria</p>
                </div>

                <form id="form-login" novalidate>
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" id="usuario" class="form-control" required autocomplete="username" autofocus>
                        <div class="invalid-feedback">Ingrese el usuario.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required autocomplete="current-password">
                        <div class="invalid-feedback">Ingrese la contraseña.</div>
                    </div>
                    <div id="error-login" class="alert alert-danger py-2 d-none"></div>
                    <button type="submit" id="btn-ingresar" class="btn btn-vet w-100">Ingresar</button>
                </form>

                <div class="text-center mt-3">
                    <a href="index.html" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
