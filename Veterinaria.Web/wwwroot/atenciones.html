<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Registro de atenciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="container py-4">
        <div class="titulo-pagina">
            <h1><i class="bi bi-clipboard2-pulse text-vet"></i> Registro de atenciones</h1>
            <button id="btn-nuevo" class="btn btn-vet"><i class="bi bi-plus-lg"></i> Nueva atención</button>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <form id="form-filtros" class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label for="filtro-cliente" class="form-label">Cliente</label>
                        <select id="filtro-cliente" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <label for="filtro-mascota" class="form-label">Mascota</label>
                        <select id="filtro-mascota" class="form-select" disabled>
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="filtro-tipo" class="form-label">Tipo de atención</label>
                        <select id="filtro-tipo" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <label for="filtro-desde" class="form-label">Desde</label>
                        <input type="date" id="filtro-desde" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label for="filtro-hasta" class="form-label">Hasta</label>
                        <input type="date" id="filtro-hasta" class="form-control">
                    </div>
                    <div class="col-md-1 d-grid">
                        <button type="submit" class="btn btn-outline-secondary" title="Buscar"><i class="bi bi-search"></i></button>
                    </div>
                    <div class="col-12 d-flex justify-content-between">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filtro-inactivas">
                            <label class="form-check-label" for="filtro-inactivas">Mostrar dadas de baja</label>
                        </div>
                        <button type="button" id="btn-limpiar" class="btn btn-link btn-sm p-0">Limpiar filtros</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Mascota</th>
                            <th>Tipo</th>
                            <th>Descripción</th>
                            <th class="text-end">Importe</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                    <tfoot class="table-light">
                        <tr>
                            <th colspan="5" id="total-cantidad"></th>
                            <th class="text-end" id="total-importe"></th>
                            <th colspan="2"></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <form id="form-atencion" class="modal-content" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Nueva atención</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-3">
                    <div class="col-md-6">
                        <label for="cliente" class="form-label">1. Cliente *</label>
                        <select id="cliente" class="form-select" required></select>
                        <div class="invalid-feedback">Seleccione el cliente.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="mascota" class="form-label">2. Mascota *</label>
                        <select id="mascota" class="form-select" required disabled>
                            <option value="">Primero seleccione un cliente</option>
                        </select>
                        <div class="invalid-feedback">Seleccione la mascota.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="tipo" class="form-label">3. Tipo de atención *</label>
                        <select id="tipo" class="form-select" required disabled></select>
                        <div class="invalid-feedback">Seleccione el tipo de atención.</div>
                    </div>
                    <div class="col-md-3">
                        <label for="fecha" class="form-label">Fecha *</label>
                        <input type="date" id="fecha" class="form-control" required>
                        <div class="invalid-feedback">La fecha es obligatoria y no puede ser futura.</div>
                    </div>
                    <div class="col-md-3">
                        <label for="importe" class="form-label">Importe *</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text">$</span>
                            <input type="number" id="importe" class="form-control" min="0.01" step="0.01" required>
                            <div class="invalid-feedback">Debe ser mayor a 0.</div>
                        </div>
                    </div>
                    <div class="col-12">
                        <label for="descripcion" class="form-label">Descripción *</label>
                        <textarea id="descripcion" class="form-control" rows="3" maxlength="255" required></textarea>
                        <div class="invalid-feedback">La descripción es obligatoria.</div>
                        <div class="form-text"><span id="contador">0</span>/255 caracteres</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-vet">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/atenciones.js"></script>
</body>
</html>
