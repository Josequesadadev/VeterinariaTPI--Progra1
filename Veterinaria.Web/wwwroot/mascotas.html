<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Mascotas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="container py-4">
        <div class="titulo-pagina">
            <h1><i class="bi bi-bag-heart text-vet"></i> Mascotas</h1>
            <button id="btn-nuevo" class="btn btn-vet"><i class="bi bi-plus-lg"></i> Nueva mascota</button>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <form id="form-filtros" class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label for="filtro-cliente" class="form-label">Cliente</label>
                        <select id="filtro-cliente" class="form-select"></select>
                    </div>
                    <div class="col-md-3">
                        <label for="filtro-tipo" class="form-label">Tipo</label>
                        <select id="filtro-tipo" class="form-select"></select>
                    </div>
                    <div class="col-md-3">
                        <label for="filtro-nombre" class="form-label">Nombre</label>
                        <input type="text" id="filtro-nombre" class="form-control">
                    </div>
                    <div class="col-md-3 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filtro-inactivos">
                            <label class="form-check-label" for="filtro-inactivos">Inactivas</label>
                        </div>
                        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Buscar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Edad</th>
                            <th>Dueño</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog">
            <form id="form-mascota" class="modal-content" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Nueva mascota</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-3">
                    <div class="col-8">
                        <label for="nombre" class="form-label">Nombre *</label>
                        <input type="text" id="nombre" class="form-control" maxlength="50" required>
                        <div class="invalid-feedback">Obligatorio.</div>
                    </div>
                    <div class="col-4">
                        <label for="edad" class="form-label">Edad *</label>
                        <input type="number" id="edad" class="form-control" min="0" max="100" step="1" required>
                        <div class="invalid-feedback">No puede ser negativa.</div>
                    </div>
                    <div class="col-12">
                        <label for="tipo" class="form-label">Tipo de mascota *</label>
                        <select id="tipo" class="form-select" required></select>
                        <div class="invalid-feedback">Seleccione el tipo.</div>
                    </div>
                    <div class="col-12">
                        <label for="cliente" class="form-label">Dueño (cliente) *</label>
                        <select id="cliente" class="form-select" required></select>
                        <div class="invalid-feedback">Seleccione el cliente.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-vet">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/mascotas.js"></script>
</body>
</html>
