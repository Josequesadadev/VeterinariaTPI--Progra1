<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="principal.html">Veterinaria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Soporte</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="clientes.html">Clientes</a></li>
                            <li><a class="dropdown-item" href="mascotas.html">Mascotas</a></li>
                            <li><a class="dropdown-item" href="tipos-mascota.html">Tipos de mascota</a></li>
                            <li><a class="dropdown-item" href="tipos-atencion.html">Tipos de atención</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Transacción</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="atenciones.html">Atenciones</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="principal.html">Dashboard</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Acerca de</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="acerca.html">Integrantes</a></li>
                        </ul>
                    </li>
                </ul>
                <span class="navbar-text me-3" id="usuario-logueado"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Clientes</h2>

        <div class="row g-2 mb-3">
            <div class="col-md-5">
                <input type="text" id="filtro-texto" class="form-control" placeholder="Buscar por código, nombre o apellido">
            </div>
            <div class="col-md-2">
                <button class="btn btn-secondary" onclick="cargarClientes()">Buscar</button>
            </div>
            <div class="col-md-3 pt-2">
                <input type="checkbox" id="filtro-inactivos" onchange="cargarClientes()"> Ver inactivos
            </div>
            <div class="col-md-2 text-end">
                <button class="btn btn-success" onclick="nuevoCliente()">Nuevo cliente</button>
            </div>
        </div>

        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Apellido y nombre</th>
                    <th>Sexo</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>

    <div class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Nuevo cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <label>Código</label>
                    <input type="text" id="codigo" class="form-control mb-2" maxlength="10">
                    <label>Nombre</label>
                    <input type="text" id="nombre" class="form-control mb-2" maxlength="50">
                    <label>Apellido</label>
                    <input type="text" id="apellido" class="form-control mb-2" maxlength="50">
                    <label>Sexo</label>
                    <select id="sexo" class="form-select mb-2">
                        <option value="">Seleccione...</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="X">Otro</option>
                    </select>
                    <label>Teléfono</label>
                    <input type="text" id="telefono" class="form-control mb-2" maxlength="20">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarCliente()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
