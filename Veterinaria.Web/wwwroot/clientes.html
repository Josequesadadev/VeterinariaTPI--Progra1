<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="container py-4">
        <div class="titulo-pagina">
            <h1><i class="bi bi-people text-vet"></i> Clientes</h1>
            <button id="btn-nuevo" class="btn btn-vet"><i class="bi bi-plus-lg"></i> Nuevo cliente</button>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <form id="form-filtros" class="row g-2 align-items-end">
                    <div class="col-md-6">
                        <label for="filtro-texto" class="form-label">Buscar</label>
                        <input type="text" id="filtro-texto" class="form-control" placeholder="Código, nombre o apellido">
                    </div>
                    <div class="col-md-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filtro-inactivos">
                            <label class="form-check-label" for="filtro-inactivos">Mostrar inactivos</label>
                        </div>
                    </div>
                    <div class="col-md-3 text-md-end">
                        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Buscar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Código</th>
                            <th>Apellido y nombre</th>
                            <th>Sexo</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal alta / edicion -->
    <div class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog">
            <form id="form-cliente" class="modal-content" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Nuevo cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-3">
                    <div class="col-4">
                        <label for="codigo" class="form-label">Código *</label>
                        <input type="text" id="codigo" class="form-control" maxlength="10" required>
                        <div class="invalid-feedback">Obligatorio.</div>
                    </div>
                    <div class="col-8">
                        <label for="sexo" class="form-label">Sexo *</label>
                        <select id="sexo" class="form-select" required>
                            <option value="">Seleccione...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="X">Otro</option>
                        </select>
                        <div class="invalid-feedback">Seleccione el sexo.</div>
                    </div>
                    <div class="col-6">
                        <label for="nombre" class="form-label">Nombre *</label>
                        <input type="text" id="nombre" class="form-control" maxlength="50" required>
                        <div class="invalid-feedback">Obligatorio.</div>
                    </div>
                    <div class="col-6">
                        <label for="apellido" class="form-label">Apellido *</label>
                        <input type="text" id="apellido" class="form-control" maxlength="50" required>
                        <div class="invalid-feedback">Obligatorio.</div>
                    </div>
                    <div class="col-12">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" maxlength="20" pattern="^\+?[0-9\- ]{6,20}$" placeholder="351-1234567">
                        <div class="invalid-feedback">Solo números, espacios o guiones (6 a 20 caracteres).</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-vet">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
